name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate-jobs:
    runs-on: ubuntu-latest
    outputs:
      session: ${{ steps.set-matrix.outputs.session }}
    steps:
    - name: Check out code
      uses: actions/checkout@v5
    - name: Install nox
      uses: wntrblm/nox@2025.11.12
    - id: set-matrix
      shell: bash
      run: echo session=$(nox --json -l | jq -c '[.[].session]') | tee --append $GITHUB_OUTPUT

  checks:
    name: Session ${{ matrix.session }}
    needs: [generate-jobs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJson(needs.generate-jobs.outputs.session) }}
    steps:
    - name: Check out code
      uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.9.11"
        enable-cache: true
    - name: Install nox
      uses: wntrblm/nox@2025.11.12
    - name: Run tests
      run: nox -s "${{ matrix.session }}"
